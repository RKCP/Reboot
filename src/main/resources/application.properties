spring.application.name=reboot-app

# Cassandra
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS
spring.cassandra.connect-timeout-millis=10000
spring.cassandra.read-timeout-millis=10000
spring.cassandra.connect-timeout=10000ms
spring.cassandra.read-timeout=10000ms
spring.cassandra.pool.pool-timeout=10000ms
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.port=9042
spring.cassandra.contact-points=localhost
spring.cassandra.keyspace-name=reboot_app
spring.cassandra.username=cassandra
spring.cassandra.password=cassandra


# Actuator
management.endpoints.web.exposure.include=health
management.health.cassandra.enabled=true